# Code-quality gate for the add-on source. The openclaw-config/ deployment
# scripts and shippable shell glue are operator tooling, not the Python service,
# and are intentionally not linted here.
target-version = "py312"
line-length = 100
extend-exclude = ["openclaw-config", "srv"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]  # pyflakes + import sorting + syntax
